name: Capturas reales de Butterfly Cafe
on:
  push:
    branches: [main]
    paths:
      - 'apps/customer/**'
      - 'apps/admin/**'
      - 'data/**'
      - '.github/workflows/capture-ui.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/customer/**'
      - 'apps/admin/**'
      - 'data/**'
      - '.github/workflows/capture-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Serve repository
        run: |
          python3 -m http.server 4173 --directory . > /tmp/butterfly-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/apps/customer/ >/dev/null && break || sleep 1; done
      - name: Capture and smoke-test customer and admin interfaces
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:430,height:932},deviceScaleFactor:1});
          const pageErrors = [];
          page.on('pageerror', e => pageErrors.push(e.message));
          await page.goto('http://127.0.0.1:4173/apps/customer/', {waitUntil:'networkidle'});
          await page.waitForSelector('[data-add-cart="cappuccino"]');
          await page.locator('[data-add-cart="cappuccino"]').first().click();
          await page.locator('#cart-open').waitFor({state:'visible'});
          await page.locator('#cart-open').click();
          await page.locator('#cart-dialog[open]').waitFor();
          if (!(await page.locator('#cart-content').innerText()).includes('Cappuccino')) throw new Error('Customer cart did not show the selected product.');
          if (!(await page.locator('#cart-content').innerText()).includes('todavía no ha activado')) throw new Error('Customer orders should remain disabled until the owner approves the catalogue.');
          if (!(await page.locator('#checkout-form').isHidden())) throw new Error('Checkout must stay hidden until customer order intake is enabled.');
          await page.locator('#cart-clear').click();
          await page.locator('[data-cart-close]').click();
          await page.screenshot({path:'butterfly-cafe-cliente.png',fullPage:true});
          await page.goto('http://127.0.0.1:4173/apps/admin/', {waitUntil:'networkidle'});
          await page.waitForFunction(() => document.querySelector('#metric-products')?.textContent === '4');
          await page.screenshot({path:'butterfly-cafe-admin.png',fullPage:true});

          // Test the unpublished draft preview.
          await page.locator('#preview-open').click();
          await page.locator('#customer-preview-dialog[open]').waitFor();
          await page.locator('[data-preview-view="coffee"]').click();
          const coffeePreview = await page.locator('#customer-preview-content').innerText();
          if (!coffeePreview.includes('Cappuccino')) throw new Error('Customer preview did not show the current coffee products.');
          await page.locator('[data-preview-view="events"]').click();
          const eventsPreview = await page.locator('#customer-preview-content').innerText();
          if (!eventsPreview.includes('El ganador del evento es')) throw new Error('Events preview did not show the event draft.');
          await page.locator('[data-preview-close]').click();

          // Test category creation without publishing the draft.
          await page.locator('[data-admin-tab="categories"]').click();
          await page.locator('#category-name').fill('Playwright Test Category');
          await page.locator('#category-group').selectOption('sweet');
          await page.locator('#add-category').click();
          if (!(await page.locator('#categories').innerText()).includes('Playwright Test Category')) throw new Error('Admin category creation failed.');

          // Test in-app announcement authoring in BC Admin.
          await page.locator('[data-admin-tab="notifications"]').click();
          await page.locator('#notice-title').fill('Playwright test notice');
          await page.locator('#notice-message').fill('This is a local preview test; it will not be published.');
          await page.locator('#add-notice').click();
          if (!(await page.locator('#notice-admin-list').innerText()).includes('Playwright test notice')) throw new Error('Admin announcement creation failed.');

          // Direct image upload and compressed media preview; do not publish this test draft.
          await page.locator('[data-admin-tab="promotions"]').click();
          await page.locator('#promo-title').fill('Playwright photo promotion');
          await page.locator('#promo-desc').fill('Image upload smoke test');
          const svg = Buffer.from('<svg xmlns="http://www.w3.org/2000/svg" width="8" height="8"><rect width="8" height="8" fill="#7e4294"/></svg>');
          await page.locator('#promo-image-file').setInputFiles({name:'promo.svg',mimeType:'image/svg+xml',buffer:svg});
          await page.locator('#promo-image-preview img').waitFor();
          await page.locator('#add-promo').click();
          if (!(await page.locator('#promo-admin-list').innerText()).includes('Playwright photo promotion')) throw new Error('Admin promotion media staging failed.');
          if (!(await page.locator('#promo-admin-list img.managed-thumb').count())) throw new Error('The uploaded promotion image preview was not shown.');

          // Verify the publication history and push setup pages are accessible.
          await page.locator('[data-admin-tab="history"]').click();
          if (!(await page.locator('#publication-history-list').innerText()).includes('Todavía no hay publicaciones')) throw new Error('Publication history screen did not render its empty state.');
          await page.locator('[data-admin-tab="push"]').click();
          await page.locator('#backend-api-url').fill('https://api.example.test');
          await page.locator('#orders-api-token').fill('playwright-admin-api-token-12345678901234567890');
          await page.locator('#save-api-settings').click();
          if (!(await page.locator('#push-config-status').innerText()).includes('URL del servidor válida')) throw new Error('Backend HTTPS URL validation did not update.');

          // Mock the Worker API to smoke-test order management, sales and push administration.
          let apiPatchRequests = 0, apiPushRequests = 0;
          await page.route('https://api.example.test/**', async route => {
            const request = route.request(), url = new URL(request.url());
            if (url.pathname === '/api/admin/orders' && request.method() === 'GET') {
              return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({orders:[{
                id:'order-test-1',order_number:'BC-TEST-0001',created_at:'2026-11-23T12:00:00.000Z',
                customer_name:'Cliente Playwright',customer_phone:'+15555550100',customer_notes:'Sin azúcar',
                order_status:'pending',payment_status:'unpaid',subtotal_cents:550,currency:'USD',
                items:[{productId:'cappuccino',productName:'Cappuccino',quantity:1,unitPrice:5.5,lineTotal:5.5}]
              }]})});
            }
            if (url.pathname === '/api/admin/orders/order-test-1' && request.method() === 'PATCH') {
              apiPatchRequests++;
              return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({order:{id:'order-test-1'}})});
            }
            if (url.pathname === '/api/admin/stats' && request.method() === 'GET') {
              return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({
                from:'2026-11-01',to:'2026-11-23',currency:'USD',orderCount:3,paidOrderCount:2,
                unpaidOrderCount:1,completedOrderCount:1,revenue:11,
                topProducts:[{product_name:'Cappuccino',units_sold:2,revenue:11}],
                daily:[{day:'2026-11-23',paid_orders:2,revenue_cents:1100}]
              })});
            }
            if (url.pathname === '/api/admin/push/send' && request.method() === 'POST') {
              apiPushRequests++;
              return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({success:true,result:{webSent:1,nativeSent:0,failed:0,total:1}})});
            }
            return route.fulfill({status:404,contentType:'application/json',body:'{"error":"Not found"}'});
          });
          await page.locator('[data-admin-tab="orders"]').click();
          if (await page.locator('#orders-enabled').isChecked()) throw new Error('Order intake must start disabled until the owner approves catalogue prices.');
          await page.locator('#orders-enabled').check();
          await page.locator('.order-card').waitFor();
          if (!(await page.locator('#orders-list').innerText()).includes('Cliente Playwright')) throw new Error('Admin did not render the test order.');
          await page.locator('[data-order-status]').selectOption('ready');
          await page.locator('[data-payment-status]').selectOption('paid');
          await page.locator('[data-order-save]').click();
          await page.waitForFunction(() => document.querySelector('.order-card-status')?.textContent.includes('Cambios guardados'));
          if (apiPatchRequests !== 1) throw new Error('Admin order status update was not sent.');
          await page.locator('[data-admin-tab="sales"]').click();
          await page.waitForFunction(() => document.querySelector('#sales-revenue')?.textContent.includes('11.00'));
          if (!(await page.locator('#sales-top-products').innerText()).includes('Cappuccino')) throw new Error('Sales top-product data was not displayed.');
          await page.locator('[data-admin-tab="push"]').click();
          await page.locator('#push-send-title').fill('Playwright notice');
          await page.locator('#push-send-body').fill('Testing admin push workflow.');
          await page.locator('#push-send').click();
          await page.waitForFunction(() => document.querySelector('#push-send-status')?.textContent.includes('1 Web Push'));
          if (apiPushRequests !== 1) throw new Error('Admin push send request was not sent.');

          // Verify optimistic concurrency: a changed catalog SHA must block the write.
          let mode = 'conflict', catalogReads = 0, putRequests = 0, mediaPutRequests = 0, catalogPutRequests = 0, publishedCatalog = null;
          const { readFile } = await import('node:fs/promises');
          const catalogBase64 = (await readFile('data/catalog.json')).toString('base64');
          await page.route('https://api.github.com/**', async route => {
            const request = route.request(), url = new URL(request.url());
            if (url.pathname === '/user') return route.fulfill({status:200,contentType:'application/json',body:'{"login":"playwright"}'});
            if (url.pathname.endsWith('/contents/data/catalog.json') && request.method() === 'GET') {
              catalogReads++;
              const sha = mode === 'conflict' ? (catalogReads === 1 ? 'sha-loaded' : 'sha-changed-remotely') : 'sha-stable';
              return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({sha,content:catalogBase64})});
            }
            if (request.method() === 'GET' && url.pathname.includes('/contents/apps/customer/assets/media/')) {
              return route.fulfill({status:404,contentType:'application/json',body:'{"message":"Not Found"}'});
            }
            if (request.method() === 'PUT') {
              putRequests++;
              const body = request.postDataJSON();
              if (url.pathname.endsWith('/contents/data/catalog.json')) {
                catalogPutRequests++;
                publishedCatalog = JSON.parse(Buffer.from(body.content,'base64').toString('utf8'));
                return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({content:{sha:'sha-published'},commit:{sha:'catalog-commit',html_url:'https://github.com/Alejandrokiriatos/opne-piece-sada/commit/catalog-commit'}})});
              }
              if (url.pathname.includes('/contents/apps/customer/assets/media/')) {
                mediaPutRequests++;
                return route.fulfill({status:201,contentType:'application/json',body:JSON.stringify({content:{sha:'media-blob-'+mediaPutRequests},commit:{sha:'media-commit-'+mediaPutRequests}})});
              }
            }
            return route.fulfill({status:404,contentType:'application/json',body:'{"message":"Not Found"}'});
          });
          page.on('dialog', dialog => dialog.accept());
          await page.locator('.settings summary').click();
          await page.locator('#token').fill('playwright-test-token');
          await page.locator('#connect').click();
          await page.waitForFunction(() => document.querySelector('#status')?.textContent.includes('Conexión correcta'));
          await page.locator('[data-admin-tab="news"]').click();
          await page.locator('#news-title').fill('Concurrent publication test');
          await page.locator('#news-desc').fill('Must not overwrite another admin.');
          await page.locator('#add-news').click();
          await page.locator('#publish').click();
          await page.locator('#accept-publish').click();
          await page.waitForFunction(() => document.querySelector('#status')?.textContent.includes('Conflicto de publicación'));
          if (putRequests !== 0) throw new Error('BC Admin attempted to overwrite the catalog after a SHA conflict.');
          if (catalogReads < 2) throw new Error('The concurrent catalog version was not checked before publication.');

          // Now simulate a successful publication to verify new file uploads and the publication audit entry.
          mode = 'success';
          catalogReads = 0; putRequests = 0; mediaPutRequests = 0; catalogPutRequests = 0; publishedCatalog = null;
          await page.reload({waitUntil:'networkidle'});
          await page.waitForFunction(() => document.querySelector('#metric-products')?.textContent === '4');
          await page.locator('.settings summary').click();
          await page.locator('#token').fill('playwright-test-token');
          await page.locator('#connect').click();
          await page.waitForFunction(() => document.querySelector('#status')?.textContent.includes('Conexión correcta'));

          await page.locator('[data-admin-tab="promotions"]').click();
          await page.locator('#promo-title').fill('Published image test');
          await page.locator('#promo-desc').fill('Uploaded directly from BC Admin.');
          await page.locator('#promo-image-file').setInputFiles({name:'promo-success.svg',mimeType:'image/svg+xml',buffer:svg});
          await page.locator('#promo-image-preview img').waitFor();
          await page.locator('#add-promo').click();

          await page.locator('[data-admin-tab="events"]').click();
          await page.locator('#event-image-file').setInputFiles({name:'event-cover.svg',mimeType:'image/svg+xml',buffer:svg});
          await page.locator('#event-gallery-files').setInputFiles([
            {name:'gallery-one.svg',mimeType:'image/svg+xml',buffer:svg},
            {name:'gallery-two.svg',mimeType:'image/svg+xml',buffer:svg}
          ]);
          await page.locator('#event-gallery-preview img').first().waitFor();

          await page.locator('#publish').click();
          await page.locator('#accept-publish').click();
          await page.waitForFunction(() => document.querySelector('#status')?.textContent.includes('¡Publicado!'));
          if (catalogReads < 2 || catalogPutRequests !== 1 || mediaPutRequests !== 4) throw new Error('Expected one catalog write and four media uploads; got reads='+catalogReads+', catalog PUTs='+catalogPutRequests+', media PUTs='+mediaPutRequests+'.');
          if (!publishedCatalog?.promotions?.some(p => p.title === 'Published image test' && p.image.includes('/assets/media/'))) throw new Error('The published promotion does not reference its uploaded image.');
          if (!publishedCatalog?.event?.image?.includes('/assets/media/') || (publishedCatalog.event.images||[]).length < 2) throw new Error('The current event cover/gallery did not publish its uploaded images.');
          if (!(publishedCatalog.publicationHistory||[]).length) throw new Error('The publication history entry was not saved.');
          await page.locator('[data-admin-tab="history"]').click();
          if (!(await page.locator('#publication-history-list').innerText()).includes('Publicación')) throw new Error('The publication history entry did not render in BC Admin.');

          if (pageErrors.length) throw new Error('Browser page errors: ' + pageErrors.join(' | '));
          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: butterfly-cafe-capturas-reales
          path: |
            butterfly-cafe-cliente.png
            butterfly-cafe-admin.png
          retention-days: 14
