name: Deploy Butterfly Café API (Cloudflare Workers + D1)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/cloudflare-worker/**'
      - '.github/workflows/deploy-api.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      ADMIN_API_TOKEN: ${{ secrets.BUTTERFLY_ADMIN_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check deployment secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          ADMIN_API_TOKEN: ${{ secrets.BUTTERFLY_ADMIN_API_TOKEN }}
        run: |
          missing=0
          for key in CF_API_TOKEN CF_ACCOUNT_ID D1_DATABASE_ID ADMIN_API_TOKEN; do
            if [ -z "${!key}" ]; then echo "::warning::$key is not configured"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then
            {
              echo "## Butterfly Café API: deployment skipped"
              echo "Configure these repository Actions secrets before deploying:"
              echo "- CLOUDFLARE_API_TOKEN (Workers Scripts: Edit and D1: Edit)"
              echo "- CLOUDFLARE_ACCOUNT_ID"
              echo "- CLOUDFLARE_D1_DATABASE_ID (create the `butterfly-cafe-db` D1 database first)"
              echo "- BUTTERFLY_ADMIN_API_TOKEN (random secret with at least 32 characters)"
              echo ""
              echo "Optional push secrets: VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT, FCM_SERVICE_ACCOUNT_JSON."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
      - name: Configure D1 binding and install dependencies
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' && env.D1_DATABASE_ID != '' && env.ADMIN_API_TOKEN != '' }}
        working-directory: backend/cloudflare-worker
        env:
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path("wrangler.toml")
          s = p.read_text()
          placeholder = "00000000-0000-0000-0000-000000000001"
          database_id = os.environ["D1_DATABASE_ID"].strip()
          if not database_id:
              raise SystemExit("D1_DATABASE_ID is empty")
          p.write_text(s.replace(placeholder, database_id))
          PY
          npm install
      - name: Apply database migrations
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' && env.D1_DATABASE_ID != '' && env.ADMIN_API_TOKEN != '' }}
        working-directory: backend/cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply butterfly-cafe-db --remote
      - name: Configure private server credentials
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' && env.D1_DATABASE_ID != '' && env.ADMIN_API_TOKEN != '' }}
        working-directory: backend/cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_API_TOKEN: ${{ secrets.BUTTERFLY_ADMIN_API_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$ADMIN_API_TOKEN" | npx wrangler secret put ADMIN_API_TOKEN
          if [ -n "$VAPID_PUBLIC_KEY" ]; then printf '%s' "$VAPID_PUBLIC_KEY" | npx wrangler secret put VAPID_PUBLIC_KEY; fi
          if [ -n "$VAPID_PRIVATE_KEY" ]; then printf '%s' "$VAPID_PRIVATE_KEY" | npx wrangler secret put VAPID_PRIVATE_KEY; fi
          if [ -n "$VAPID_SUBJECT" ]; then printf '%s' "$VAPID_SUBJECT" | npx wrangler secret put VAPID_SUBJECT; fi
          if [ -n "$FCM_SERVICE_ACCOUNT_JSON" ]; then printf '%s' "$FCM_SERVICE_ACCOUNT_JSON" | npx wrangler secret put FCM_SERVICE_ACCOUNT_JSON; fi
      - name: Deploy Worker
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' && env.D1_DATABASE_ID != '' && env.ADMIN_API_TOKEN != '' }}
        id: deploy
        working-directory: backend/cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy 2>&1 | tee deploy-output.txt
          WORKER_URL=$(grep -Eo 'https://[^ ]+\\.workers\\.dev' deploy-output.txt | tail -1 || true)
          {
            echo "## Butterfly Café API"
            if [ -n "$WORKER_URL" ]; then
              echo "Worker endpoint: $WORKER_URL"
              echo "Set this URL in BC Admin → Push → Dirección HTTPS del servidor API, save it, then publish the catalog."
            else
              echo "Worker deployment command completed. Copy the workers.dev URL shown in the deploy logs into BC Admin."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
