name: Publish Butterfly Café web apps
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'data/**'
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Pages site
        run: |
          mkdir -p public/customer public/admin
          cp -R apps/customer/. public/customer/
          cp -R apps/admin/. public/admin/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
