name: Build Butterfly Café Android apps
on:
  push:
    branches: [main]
    paths:
      - 'apps/customer/**'
      - 'apps/admin/**'
      - 'data/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
    inputs:
      app:
        description: Which Android app to build
        required: true
        type: choice
        options:
          - customer
          - admin
          - both
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ github.event_name == 'push' && fromJSON('["customer","admin"]') || (inputs.app == 'both' && fromJSON('["customer","admin"]') || fromJSON(format('["{0}"]', inputs.app))) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Capacitor
        working-directory: apps/${{ matrix.app }}
        run: |
          npm install
          mkdir -p www
          cp index.html app.js styles.css manifest.webmanifest www/
          cp -R assets www/assets
          npx cap add android
          npm install --no-save sharp
          node -e "const sharp=require('sharp');const fs=require('fs');const path=require('path');const src='assets/butterfly-cafe-logo.svg';const base='android/app/src/main/res';(async()=>{for(const [folder,size] of [['mipmap-mdpi',48],['mipmap-hdpi',72],['mipmap-xhdpi',96],['mipmap-xxhdpi',144],['mipmap-xxxhdpi',192]]){const dir=path.join(base,folder);fs.mkdirSync(dir,{recursive:true});await sharp(src).resize(size,size).png().toFile(path.join(dir,'ic_launcher.png'));await sharp(src).resize(size,size).png().toFile(path.join(dir,'ic_launcher_round.png'));}})().catch(e=>{console.error(e);process.exit(1)})"
          npx cap sync android
          # Replace Capacitor's default launcher assets after sync. Use the Butterfly Café logo
          # for legacy launcher icons and remove default adaptive XML icons that override them.
          node -e "const sharp=require('sharp');const fs=require('fs');const path=require('path');const src='assets/butterfly-cafe-logo.svg';const base='android/app/src/main/res';(async()=>{for(const [folder,size] of [['mipmap-mdpi',48],['mipmap-hdpi',72],['mipmap-xhdpi',96],['mipmap-xxhdpi',144],['mipmap-xxxhdpi',192]]){const dir=path.join(base,folder);fs.mkdirSync(dir,{recursive:true});await sharp(src).resize(size,size,{fit:'contain'}).png().toFile(path.join(dir,'ic_launcher.png'));await sharp(src).resize(size,size,{fit:'contain'}).png().toFile(path.join(dir,'ic_launcher_round.png'));}for(const file of ['android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml','android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml']){if(fs.existsSync(file))fs.unlinkSync(file);}})().catch(e=>{console.error(e);process.exit(1)})"
      - name: Build APK
        working-directory: apps/${{ matrix.app }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: butterfly-cafe-${{ matrix.app }}-apk
          path: apps/${{ matrix.app }}/android/app/build/outputs/apk/debug/app-debug.apk
