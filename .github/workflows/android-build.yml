name: Build Butterfly Café Android apps
on:
  push:
    branches: [main]
    paths:
      - 'apps/customer/**'
      - 'apps/admin/**'
      - 'data/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
    inputs:
      app:
        description: Which Android app to build
        required: true
        type: choice
        options:
          - customer
          - admin
          - both
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ github.event_name == 'push' && fromJSON('["customer","admin"]') || (inputs.app == 'both' && fromJSON('["customer","admin"]') || fromJSON(format('["{0}"]', inputs.app))) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Capacitor
        working-directory: apps/${{ matrix.app }}
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Build APK
        working-directory: apps/${{ matrix.app }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: butterfly-cafe-${{ matrix.app }}-apk
          path: apps/${{ matrix.app }}/android/app/build/outputs/apk/debug/app-debug.apk
