name: Build and release Butterfly Café Android apps
on:
  push:
    branches: [main]
    paths:
      - 'apps/customer/**'
      - 'apps/admin/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/customer/**'
      - 'apps/admin/**'
      - '.github/workflows/android-build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare app and Android project
        working-directory: apps/${{ matrix.app }}
        run: |
          npm install
          npm install --no-save sharp esbuild
          mkdir -p www
          cp index.html app.js styles.css manifest.webmanifest www/
          npx esbuild app-update.js --bundle --format=iife --outfile=www/app-update.bundle.js
          if [ "${{ matrix.app }}" = "admin" ]; then npx esbuild token-storage.js --bundle --format=iife --outfile=www/token-storage.bundle.js; fi
          cp -R assets www/assets
          printf 'window.BC_APP_VERSION=%s;window.BC_APP_NAME="%s";\n' "$GITHUB_RUN_NUMBER" "${{ matrix.app }}" > www/build-info.js
          sed -i 's|<script src="app-update.js"></script>|<script src="build-info.js"></script><script src="app-update.bundle.js"></script>|' www/index.html
          npx cap add android
          npx cap sync android
          # Add native APK installation so the app downloads in-place and opens Android's installer.
          if [ "${{ matrix.app }}" = "customer" ]; then PACKAGE="com.butterflycafe.app"; else PACKAGE="com.butterflycafe.admin"; fi
          export PACKAGE
          JAVA_DIR="android/app/src/main/java/${PACKAGE//./\/}"
          mkdir -p "$JAVA_DIR" android/app/src/main/res/xml
          cp native/ApkInstallerPlugin.java "$JAVA_DIR/ApkInstallerPlugin.java"
          if [ "${{ matrix.app }}" = "admin" ]; then cp native/SecureTokenPlugin.java "$JAVA_DIR/SecureTokenPlugin.java"; fi
          cp native/ApkInstallStatusReceiver.java "$JAVA_DIR/ApkInstallStatusReceiver.java"
          cat > android/app/src/main/res/xml/bc_file_paths.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="cache" path="." />
              <files-path name="files" path="." />
          </paths>
          XML
          python3 - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET
          package = os.environ["PACKAGE"]
          ns = "{http://schemas.android.com/apk/res/android}"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          root = ET.parse(manifest).getroot()
          if not any(p.get(ns + "name") == "android.permission.REQUEST_INSTALL_PACKAGES" for p in root.findall("uses-permission")):
              ET.SubElement(root, "uses-permission", {ns + "name": "android.permission.REQUEST_INSTALL_PACKAGES"})
          app = root.find("application")
          authority = "${applicationId}.fileprovider"
          if not any(p.get(ns + "authorities") == authority for p in app.findall("provider")):
              provider = ET.SubElement(app, "provider", {
                  ns + "name": "androidx.core.content.FileProvider",
                  ns + "authorities": authority,
                  ns + "exported": "false",
                  ns + "grantUriPermissions": "true"
              })
              ET.SubElement(provider, "meta-data", {
                  ns + "name": "android.support.FILE_PROVIDER_PATHS",
                  ns + "resource": "@xml/bc_file_paths"
              })
          receiver_name = package + ".ApkInstallStatusReceiver"
          if not any(r.get(ns + "name") == receiver_name for r in app.findall("receiver")):
              ET.SubElement(app, "receiver", {ns + "name": receiver_name, ns + "exported": "false"})
          ET.indent(root, space="    ")
          ET.ElementTree(root).write(manifest, encoding="utf-8", xml_declaration=True)
          java_root = Path("android/app/src/main/java")
          candidates = list(java_root.rglob("MainActivity.java"))
          if len(candidates) != 1:
              raise SystemExit(f"Expected exactly one MainActivity.java, found {len(candidates)}")
          main = candidates[0]
          source = main.read_text()
          plugin_classes = ["ApkInstallerPlugin"] + (["SecureTokenPlugin"] if package.endswith(".admin") else [])
          import re
          imports = ["import " + package + "." + name + ";" for name in plugin_classes]
          for import_line in imports:
              if import_line not in source:
                  source = re.sub(r"(package\s+[\w.]+;)", lambda match: match.group(1) + "\n\n" + import_line, source, count=1)
          if "import android.os.Bundle;" not in source:
              source = source.replace(imports[-1], imports[-1] + "\nimport android.os.Bundle;", 1)
          registrations = ["registerPlugin(" + name + ".class);" for name in plugin_classes]
          missing = [line for line in registrations if line not in source]
          if missing:
              if "public void onCreate(Bundle savedInstanceState)" in source:
                  source = source.replace("super.onCreate(savedInstanceState);", "\n        ".join(missing) + "\n        super.onCreate(savedInstanceState);", 1)
              else:
                  source = source.replace("extends BridgeActivity {", "extends BridgeActivity {\n    @Override\n    public void onCreate(Bundle savedInstanceState) {\n        " + "\n        ".join(missing) + "\n        super.onCreate(savedInstanceState);\n    }\n", 1)
          if any(line not in source for line in imports + registrations):
              raise SystemExit("ERROR: Native plugins could not be registered in MainActivity.java")
          main.write_text(source)
          print("Verified native ApkInstallerPlugin registration in " + str(main))
          PY
          sed -i -E "s/versionCode [0-9]+/versionCode $GITHUB_RUN_NUMBER/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"1.0.$GITHUB_RUN_NUMBER\"/" android/app/build.gradle
          node -e "const sharp=require('sharp');const fs=require('fs');const path=require('path');const src='assets/butterfly-cafe-logo.svg';const base='android/app/src/main/res';(async()=>{for(const [folder,size] of [['mipmap-mdpi',48],['mipmap-hdpi',72],['mipmap-xhdpi',96],['mipmap-xxhdpi',144],['mipmap-xxxhdpi',192]]){const dir=path.join(base,folder);fs.mkdirSync(dir,{recursive:true});await sharp(src).resize(size,size,{fit:'contain'}).png().toFile(path.join(dir,'ic_launcher.png'));await sharp(src).resize(size,size,{fit:'contain'}).png().toFile(path.join(dir,'ic_launcher_round.png'));}for(const file of ['android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml','android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml']){if(fs.existsSync(file))fs.unlinkSync(file);}})().catch(e=>{console.error(e);process.exit(1)})"
      - name: Configure permanent Android signing key
        working-directory: apps/${{ matrix.app }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing repository secret ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing repository secret ANDROID_KEYSTORE_PASSWORD" && exit 1)
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          raw = os.environ["ANDROID_KEYSTORE_BASE64"].strip()
          try:
              decoded = base64.b64decode(raw, validate=True)
          except Exception as exc:
              raise SystemExit("ANDROID_KEYSTORE_BASE64 is not valid Base64") from exc
          if not decoded or decoded[:1] != b"0":
              raise SystemExit("Decoded signing file is empty or not a PKCS#12 container")
          Path("android/app/butterfly-release.p12").write_bytes(decoded)
          print("Signing file decoded and basic PKCS#12 structure checked.")
          PY
          keytool -list -keystore android/app/butterfly-release.p12 -storetype PKCS12 -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias butterfly-cafe >/dev/null
          echo "Signing certificate and alias verified."
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          signing = """    signingConfigs {
                  stable {
                      storeFile file("butterfly-release.p12")
                      storeType "pkcs12"
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias "butterfly-cafe"
                      keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  }
              }
          """
          if "signingConfigs {" not in s:
              s = s.replace("android {", "android {\n" + signing, 1)
          if "debug {" not in s[s.find("buildTypes {"):]:
              s = s.replace("buildTypes {", "buildTypes {\n        debug { signingConfig signingConfigs.stable }", 1)
          s = s.replace("release {", "release {\n            signingConfig signingConfigs.stable", 1)
          p.write_text(s)
          PY
      - name: Build APK
        working-directory: apps/${{ matrix.app }}/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/butterfly-cafe-${{ matrix.app }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: butterfly-cafe-${{ matrix.app }}-apk
          path: apps/${{ matrix.app }}/android/app/build/outputs/apk/debug/butterfly-cafe-${{ matrix.app }}.apk
  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish both Butterfly Café APKs as one versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            artifacts/butterfly-cafe-customer-apk/butterfly-cafe-customer.apk \
            artifacts/butterfly-cafe-admin-apk/butterfly-cafe-admin.apk \
            --title "Butterfly Café ${TAG}" \
            --notes "Compilación conjunta de Butterfly Café y BC Admin."
